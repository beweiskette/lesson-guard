id: no-direct-edit-generated
source: examples/notes/generated-client.md
description: Files with a generated-code header are edited through their generator, not by hand.
severity: block
event:
- pre_edit
match:
  predicates:
  - file_is_generated_marker
message: This file is generated. Change the schema or the generator (for example tools/generate_client.py)
  and rerun it instead of editing the output.
tests:
  block:
  - path: src/api/client_gen.py
    original: |
      # Code generated by tools/generate_client.py. DO NOT EDIT.
      class Client:
          pass
    content: |
      # Code generated by tools/generate_client.py. DO NOT EDIT.
      class Client:
          timeout = 5
  - tool: Edit
    path: web/types.ts
    original: |
      // @generated by schema-tool
      export type Id = string;
    added: export type Id = number;
  pass:
  - path: src/api/client.py
    original: |
      class Client:
          pass
    content: |
      class Client:
          timeout = 5
  - path: docs/generator.md
    original: |
      How the generator works: it writes files you should not touch.
    content: |
      Updated docs.
  - path: src/api/new_module.py
    content: |
      print('new file')
