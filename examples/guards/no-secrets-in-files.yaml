id: no-secrets-in-files
source: examples/notes/no-keys-in-packages.md
description: Credential-like strings do not belong in files that get shared, templates included.
severity: block
event:
- pre_edit
- pre_commit
match:
  predicates:
  - contains_secret_like
message: This text contains something that looks like an API key or token. Read it from the environment;
  the value belongs in the local .env, which the user maintains and which is never shipped.
tests:
  block:
  - path: dist/config.json
    content: |
      {"api_key": "q8Zr2Lx9Wv4Tn7Kp3Hs6Jd1Fm5Bc0Yg"}
  - event: pre_commit
    path: package/settings.py
    content: |
      TOKEN = "Zx81Qw7Er6Ty5Ui4Op3As2Df"
  - event: pre_commit
    path: .env.example
    content: |
      API_KEY=q8Zr2Lx9Wv4Tn7Kp3Hs6Jd1Fm5Bc0Yg
  pass:
  - path: package/settings.py
    content: |
      API_KEY = os.environ["API_KEY"]
  - path: .env.example
    content: |
      API_KEY=your-api-key-here
