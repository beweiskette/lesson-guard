id: no-secret-files
source: examples/notes/no-keys-in-packages.md
description: Secret files such as .env and private keys are neither written by the agent nor committed.
severity: block
event:
- pre_edit
- pre_commit
match:
  path:
  - .env
  - .env.*
  - '*.pem'
  - id_rsa
  - id_dsa
  - id_ecdsa
  - id_ed25519
  path_not:
  - .env.example
  - .env.sample
  - .env.template
message: This is a secret file (.env or a private key). It stays on this machine and out of version control.
  Ask the user to put the value in, keep the file in .gitignore, and commit .env.example with placeholders.
tests:
  block:
  - path: .env
    content: |
      API_KEY=local-value
  - event: pre_commit
    path: app/.env.local
    content: |
      DEBUG=1
  - event: pre_commit
    path: .env.production
    content: |
      DB_HOST=db.internal.test
  - event: pre_commit
    path: certs/server.pem
    content: |
      certificate data
  - path: deploy/id_rsa
    content: |
      key data
  pass:
  - path: .env.example
    content: |
      API_KEY=your-api-key-here
  - event: pre_commit
    path: app/.env.sample
    content: |
      API_KEY=
  - event: pre_commit
    path: .env.template
    content: |
      API_KEY=changeme
  - event: pre_commit
    path: deploy/id_rsa.pub
    content: |
      public key data
  - path: docs/env.md
    content: |
      How to fill in .env
